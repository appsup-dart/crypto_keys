name: crypto_keys
description: A library for doing cryptographic signing/verifying and encrypting/decrypting.
version: 0.3.1
homepage: https://github.com/appsup-dart/crypto_keys
repository: https://github.com/appsup-dart/crypto_keys
funding:
  - https://github.com/sponsors/rbellens

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  pointycastle: ^4.0.0
  meta: ^1.3.0
  collection: ^1.14.13
  ed25519_edwards: ^0.3.1

dev_dependencies:
  test: ^1.16.2
  lints: ^6.1.0
  melos: ^7.0.0

melos:
  useRootAsPackage: true

  ide:
    intellij: false

  command:
    version:
      linkToCommits: true
      workspaceChangelog: false

  scripts:
    preversion: 
      exec: dart test -j 1  